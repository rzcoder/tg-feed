name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (default: latest release tag)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      # QEMU + buildx give us cross-arch builds on x64 runners. Native
      # modules (better-sqlite3, re2, bufferutil, utf-8-validate) are
      # compiled under emulation — slower than a native ARM runner but
      # avoids splitting the workflow into a matrix + manifest-merge job.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only moves for non-prerelease release events;
          # manual dispatch never moves it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Prune old GHCR versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: tg-feed
          keep-n-tagged: 3
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}

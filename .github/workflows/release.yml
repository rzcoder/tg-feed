name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Bundle and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          version="${TAG#v}"
          bundle="tg-feed-${version}"

          pnpm install --prod --frozen-lockfile

          mkdir -p "${bundle}"/{apps/server,apps/web,packages/shared}
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "${bundle}/"
          cp -R apps/server/dist apps/server/drizzle apps/server/package.json "${bundle}/apps/server/"
          cp -R apps/web/dist "${bundle}/apps/web/"
          cp -R packages/shared/dist "${bundle}/packages/shared/"

          # Shared's repo package.json points main at src/index.ts for tsx +
          # IDE go-to-definition; rewrite to compiled dist for node runtime.
          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("packages/shared/package.json", "utf8"));
            p.main = "./dist/index.js";
            p.types = "./dist/index.d.ts";
            p.exports = { ".": { types: "./dist/index.d.ts", default: "./dist/index.js" } };
            fs.writeFileSync(process.argv[1] + "/packages/shared/package.json", JSON.stringify(p, null, 2));
          ' "${bundle}"

          # Copy node_modules preserving pnpm symlinks. Skip apps/web —
          # Vite already inlined web's runtime deps into apps/web/dist.
          tar -cf - node_modules apps/server/node_modules packages/shared/node_modules \
            | tar -xf - -C "${bundle}"

          echo "${version}" > "${bundle}/VERSION"

          tar -czf "${bundle}.tar.gz" "${bundle}"
          gh release upload "${TAG}" "${bundle}.tar.gz" --clobber

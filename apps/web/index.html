<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>tg-feed</title>
    <meta name="theme-color" content="#222428" />
    <!--
      Telegram Mini App SDK. Populates window.Telegram.WebApp when the client
      is opened inside Telegram so the app can auto-sign-in via initData.
      `async` so a slow/blocked telegram.org never delays first paint for the
      common (non-Telegram) case; the LoginPage waits for it to populate via
      `waitForTelegramInitData()` only when it detects a Telegram launch.
      Outside Telegram it's a harmless no-op and password login is used.
    -->
    <script async src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Resolve theme before React mounts to avoid flash-of-wrong-theme.
      // Mirrors apps/web/src/lib/useTheme.ts — keep in lockstep.
      (function () {
        try {
          var pref = localStorage.getItem('tg-feed:theme') || 'system';
          var resolved = pref;
          if (pref === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

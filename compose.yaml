# Example deploy:
#   cp .env.example .env   # fill it in
#   docker compose up -d

services:
  tg-feed:
    image: ghcr.io/rzcoder/tg-feed:${TG_FEED_VERSION:-latest}
    container_name: tg-feed
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    # Production build (slim image ships no pino-pretty); override a dev
    # NODE_ENV from .env so the logger doesn't reach for a missing transport.
    environment:
      - NODE_ENV=production
    volumes:
      - tg-feed-data:/app/data

volumes:
  tg-feed-data:

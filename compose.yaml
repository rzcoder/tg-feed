# Example deploy:
#   cp .env.example .env   # fill it in
#   docker compose up -d

services:
  tg-feed:
    image: ghcr.io/rzcoder/tg-feed:${TG_FEED_VERSION:-latest}
    container_name: tg-feed
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - tg-feed-data:/app/data

volumes:
  tg-feed-data:
